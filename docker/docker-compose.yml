services:

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - data_network


  mongodb:
    image: mongo:8.0
    container_name: mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${MONGO_USERNAME}",
          "--password",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - data_network


  # ==========================================================
  # PARTIE 1
  # Test MinIO + MongoDB
  # ==========================================================

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: pipeline

    depends_on:
      minio:
        condition: service_healthy

      mongodb:
        condition: service_healthy

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

    volumes:
      - ../src:/app/src
      - ../data:/app/data

    command: python -m src.part1.test_storage

    networks:
      - data_network


  # ==========================================================
  # PARTIE 2 - ÉTAPE 1
  # Source Parquet -> MinIO Raw
  # ==========================================================

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: ingestion

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

    volumes:
      - ../src:/app/src
      - ../data:/app/data

    command: python -m src.ingestion.ingest_raw

    networks:
      - data_network


  # ==========================================================
  # PARTIE 2 - ÉTAPE 2
  # MinIO Raw -> DuckDB -> MinIO Curated
  # ==========================================================

  processing:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: processing

    depends_on:
      minio:
        condition: service_healthy

      ingestion:
        condition: service_completed_successfully

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

    volumes:
      - ../src:/app/src
      - ../data:/app/data

    command: python -m src.processing.transform_curated

    networks:
      - data_network


  # ==========================================================
  # PARTIE 2 - ÉTAPE 3
  # MinIO Curated -> MongoDB
  # ==========================================================

  loading:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: loading

    depends_on:
      minio:
        condition: service_healthy

      mongodb:
        condition: service_healthy

      processing:
        condition: service_completed_successfully

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

    volumes:
      - ../src:/app/src
      - ../data:/app/data

    command: python -m src.loading.load_mongodb

    networks:
      - data_network


volumes:
  minio_data:
  mongo_data:


networks:
  data_network:
    driver: bridge